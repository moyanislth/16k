<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>16K Downloader</title>
</head>
<body>
    <h1>16K Downloader</h1>

    <h2>Auto</h2>
    <button id="btnAuto" onclick="start('auto')">Start</button>
    <div id="progAuto"></div>

    <h2>Custom</h2>
    <label>Page <input type="number" id="page" value="1" min="1"></label><br>
    <label>Size <input type="number" id="size" value="50" min="1" max="200"></label><br>
    <button id="btnCustom" onclick="start('custom')">Start</button>
    <div id="progCustom"></div>

    <h2>Stats</h2>
    <div id="stats"></div>

    <h2>Log</h2>
    <pre id="log"></pre>

    <script>
        let es, mode = '', total = 0;

        function connect() {
            if (es) es.close();
            es = new EventSource('/events');
            es.onmessage = (e) => {
                const line = e.data;
                if (line.includes('__TOTAL__:')) {
                    total = parseInt(line.split(':')[1]);
                    return;
                }
                if (line.includes('__PROGRESS__:')) {
                    const [d, t] = line.split(':')[1].split('/');
                    const pct = t > 0 ? Math.round(d / t * 100) : 0;
                    const id = mode === 'auto' ? 'progAuto' : 'progCustom';
                    document.getElementById(id).textContent = d + '/' + t + ' (' + pct + '%)';
                    if (d >= t) setTimeout(reset, 1500);
                    return;
                }
                if (line.includes('__STAT__:')) {
                    const [ok, skip, fail] = line.split(':')[1].split('/');
                    document.getElementById('stats').innerHTML =
                        'OK: ' + ok + ' | Skip: ' + skip + ' | Fail: ' + fail + ' | Total: ' + total;
                    return;
                }
                document.getElementById('log').textContent += line + '\n';
            };
            es.onerror = () => setTimeout(connect, 2000);
        }

        function reset() {
            document.getElementById('btnAuto').disabled = false;
            document.getElementById('btnCustom').disabled = false;
            document.getElementById('progAuto').textContent = '';
            document.getElementById('progCustom').textContent = '';
            document.getElementById('stats').textContent = '';
        }

        function setBtns(on) {
            document.getElementById('btnAuto').disabled = on;
            document.getElementById('btnCustom').disabled = on;
        }

        async function start(m) {
            setBtns(true);
            mode = m;
            const url = '/download?mode=' + m + (m === 'custom' ? '&page=' + document.getElementById('page').value + '&size=' + document.getElementById('size').value : '');
            try { await fetch(url); } catch(e) { setBtns(false); }
        }

        connect();
    </script>
</body>
</html>
